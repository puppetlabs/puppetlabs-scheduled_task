---
".gitlab-ci.yml":
  delete: true
appveyor.yml:
  delete: true

Gemfile:
  use_litmus: true
NOTICE:
  copyright_holders:
  - name: Puppet, Inc.
    begin: 2018
spec/spec_helper.rb:
  coverage_report: true
.gitpod.Dockerfile:
  unmanaged: false
.gitpod.yml:
  unmanaged: false
.github/workflows/auto_release.yml:
  unmanaged: false
# ci.yml and nightly.yml are maintained by hand because their Spec jobs carry
# customisations pdk-templates cannot express -- the `additional_packages` input
# (no such key in the templates) and `secrets: inherit` (needed so the Puppet 9
# lane can reach PUPPET_GEM_SOURCE / Twingate). The template emits no `with:` or
# `secrets:` block on Spec at all, so leaving them managed means the scheduled
# `pdk update` PR silently reverts Puppet 9 support. `acceptance_flags` below is
# kept in step with the hand-written `flags:` so these can go back to template
# management once pdk-templates supports those inputs.
.github/workflows/ci.yml:
  unmanaged: true
  acceptance_flags:
    - '--nightly'
.github/workflows/nightly.yml:
  unmanaged: true
  acceptance_flags:
    - '--nightly'
.github/workflows/release.yml:
  unmanaged: false
.travis.yml:
  delete: true
.rubocop.yml:
  include_todos: true
